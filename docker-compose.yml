name: logpose
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT_WEB:-3000}:80"
      - "${PORT_HTTPS:-3443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DATABASE_URL: postgres://logpose:${POSTGRES_PASSWORD:-logpose}@postgres:5432/logpose
      MONGO_URL: mongodb://mongo:27017
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logpose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpose}
      POSTGRES_DB: logpose
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpose -d logpose -h 127.0.0.1"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  caddy-data:
  caddy-config:
